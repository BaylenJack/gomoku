<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="600" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f2116"/><stop offset="1" stop-color="#150e08"/>
    </linearGradient>
    <radialGradient id="black" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#7d7d7d"/><stop offset="0.4" stop-color="#2a2a2a"/><stop offset="1" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="white" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#f0e9dd"/><stop offset="1" stop-color="#b8ab97"/>
    </radialGradient>
  </defs>
  <rect width="600" height="640" fill="url(#bg)"/>
  <text x="300" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#f3dca6" text-anchor="middle" letter-spacing="6">五子棋</text>
  <text x="300" y="80" font-family="sans-serif" font-size="13" fill="#b3a28c" text-anchor="middle" letter-spacing="2">双人在线 · 实时对战 · AI 提示</text>
  <!-- 棋盘背景 -->
  <rect x="50" y="110" width="500" height="500" rx="8" fill="#c9944f"/>
  <!-- 网格线 -->
  <g stroke="#5a3a18" stroke-width="1.4">
    <line x1="100" y1="160" x2="500" y2="160"/>
    <line x1="100" y1="220" x2="500" y2="220"/>
    <line x1="100" y1="280" x2="500" y2="280"/>
    <line x1="100" y1="340" x2="500" y2="340"/>
    <line x1="100" y1="400" x2="500" y2="400"/>
    <line x1="100" y1="460" x2="500" y2="460"/>
    <line x1="100" y1="520" x2="500" y2="520"/>
    <line x1="150" y1="110" x2="150" y2="610"/>
    <line x1="210" y1="110" x2="210" y2="610"/>
    <line x1="270" y1="110" x2="270" y2="610"/>
    <line x1="330" y1="110" x2="330" y2="610"/>
    <line x1="390" y1="110" x2="390" y2="610"/>
    <line x1="450" y1="110" x2="450" y2="610"/>
  </g>
  <!-- 棋子: 黑方五连 -->
  <circle cx="150" cy="280" r="26" fill="url(#black)"/>
  <circle cx="210" cy="280" r="26" fill="url(#black)"/>
  <circle cx="270" cy="280" r="26" fill="url(#black)"/>
  <circle cx="330" cy="280" r="26" fill="url(#black)"/>
  <circle cx="390" cy="280" r="26" fill="url(#black)" stroke="#ffd86e" stroke-width="4"/>
  <!-- 白子 -->
  <circle cx="210" cy="340" r="26" fill="url(#white)"/>
  <circle cx="270" cy="340" r="26" fill="url(#white)"/>
  <circle cx="330" cy="400" r="26" fill="url(#white)"/>
  <!-- AI 提示环 -->
  <circle cx="450" cy="340" r="20" fill="none" stroke="#ffd86e" stroke-width="3" stroke-dasharray="6 4" opacity="0.9"/>
  <!-- 底部 -->
  <text x="300" y="630" font-family="sans-serif" font-size="12" fill="#8b7a68" text-anchor="middle">github.com/BaylenJack/gomoku</text>
</svg>
